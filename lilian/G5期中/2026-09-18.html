<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>單字小考 - 9/18</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f0f8ff;
            padding: 20px;
            text-align: center;
            color: #333;
        }

        .back-nav {
            margin-bottom: 12px;
            text-align: left;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        .back-link {
            text-decoration: none;
            color: #4a90e2;
            font-weight: bold;
            font-size: 16px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            transition: 0.2s;
        }

        .back-link:hover {
            background: #e0f0ff;
            transform: translateX(-2px);
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
        }

        .list-box {
            width: 270px;
            background: white;
            border: 2px solid #4a90e2;
            border-radius: 10px;
            padding: 15px;
            text-align: left;
            min-height: 250px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .list-box h2 {
            text-align: center;
            font-size: 20px;
            color: #4a90e2;
            margin-top: 0;
            border-bottom: 2px dashed #e0f0ff;
            padding-bottom: 8px;
        }

        li {
            font-size: 18px;
            margin: 8px 0;
            cursor: pointer;
            transition: 0.2s;
            padding: 4px 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        li:hover {
            background: #e0f0ff;
        }

        .pos-badge {
            font-size: 14px;
            color: #6c757d;
            font-weight: normal;
            margin-left: 6px;
        }

        .selected-word-tag {
            background: #4a90e2;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .selected-word-tag:hover {
            background: #357abd;
        }

        .tested {
            color: #27ae60;
            font-size: 28px;
        }

        .tested .pos-badge {
            color: #27ae60;
            opacity: 0.8;
            font-size: 18px;
        }

        button {
            padding: 16px 28px;
            font-size: 22px;
            margin: 12px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            background: #ff9f43;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(255, 159, 67, 0.3);
            transition: 0.2s;
        }

        button:hover {
            background: #ff7f00;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        #currentWordDisplay {
            font-size: 44px;
            font-weight: bold;
            margin-top: 20px;
            min-height: 120px;
            line-height: 1.4;
        }

        .word-box {
            margin-top: 30px;
            font-size: 28px;
            font-weight: bold;
            min-height: 40px;
        }

        .learn-controls {
            margin-top: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
            border-radius: 16px;
            border: 2px solid #66bb6a;
            box-shadow: 0 4px 12px rgba(102, 187, 106, 0.15);
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .learn-controls h3 {
            color: #2e7d32;
            margin-top: 0;
            font-size: 22px;
        }

        .loop-selector {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
            font-size: 18px;
        }

        .loop-selector select {
            padding: 8px 12px;
            font-size: 18px;
            border-radius: 10px;
            border: 2px solid #66bb6a;
            background: white;
        }

        #learnProgress {
            margin-top: 12px;
            font-size: 20px;
            color: #2e7d32;
            font-weight: bold;
            min-height: 30px;
        }

        #learnWordDisplay {
            margin-top: 10px;
            font-size: 36px;
            font-weight: bold;
            color: #1b5e20;
            min-height: 100px;
            line-height: 1.4;
        }

        #learnStepDisplay {
            margin-top: 6px;
            font-size: 18px;
            color: #555;
            min-height: 25px;
        }
    </style>
</head>

<body>
    <div class="back-nav">
        <a href="index.html" class="back-link">← 回單字測驗列表</a>
    </div>

    <h1>單字小考 (9/18)</h1>
    <p style="font-size: 18px; color: #555;">Press the button to hear a word. It will be spoken once.</p>
    <div id="currentWordDisplay"></div>

    <div id="selectedWordsDisplay" style="margin: 20px 0; min-height: 30px;">
        <div style="font-size: 18px; color: #555; margin-bottom: 10px;">Selected Words:</div>
        <div id="selectedWordsList" style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;"></div>
    </div>

    <button onclick="nextWord()">Next Word</button>
    <button onclick="replayWord()">Replay Current Word</button>
    <button onclick="showPhonics()" style="background: #2ecc71; box-shadow: 0 4px 10px rgba(46, 204, 113, 0.3);">Show Phonics</button>
    <button onclick="startAutoQuiz()" id="autoQuizBtn" style="background: #9b59b6; box-shadow: 0 4px 10px rgba(155, 89, 182, 0.3);">🎯 自動測驗模式</button>
    <button onclick="stopAutoQuiz()" id="stopQuizBtn" style="background: #e74c3c; display: none; box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3);">⏹ 停止測驗</button>

    <div id="autoQuizStatus" style="margin-top: 15px; font-size: 24px; color: #9b59b6; font-weight: bold;"></div>

    <div class="learn-controls">
        <h3>📖 自動學習模式</h3>
        <p style="font-size: 16px; color: #555;">按下播放，孩子只要坐著聽：唸單字 → 逐字拼讀 → 音節拆解 → 完整唸一次 → 停頓跟讀</p>
        <div class="loop-selector">
            <label for="loopCount">循環次數：</label>
            <select id="loopCount">
                <option value="1">1 輪</option>
                <option value="2" selected>2 輪</option>
                <option value="3">3 輪</option>
                <option value="4">4 輪</option>
                <option value="5">5 輪</option>
            </select>
        </div>
        <div>
            <button onclick="startAutoLearn()" id="autoLearnBtn" style="background: #43a047; box-shadow: 0 4px 10px rgba(67, 160, 71, 0.3);">▶️ 開始學習</button>
            <button onclick="stopAutoLearn()" id="stopLearnBtn" style="background: #e74c3c; display: none; box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3);">⏹ 停止學習</button>
        </div>
        <div id="learnProgress"></div>
        <div id="learnWordDisplay"></div>
        <div id="learnStepDisplay"></div>
    </div>

    <div style="margin-top: 20px;">
        <label for="voiceSelector" style="font-size: 18px; margin-right: 10px;">選擇發音：</label>
        <select id="voiceSelector" onchange="changeVoice()" style="padding: 8px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc;">
        </select>
    </div>

    <div class="container">
        <div class="list-box">
            <h2>Words To Study</h2>
            <ul id="leftList" style="padding-left: 15px; margin: 0;"></ul>
        </div>

        <div class="list-box">
            <h2>Words Tested</h2>
            <ol id="rightList" style="padding-left: 25px; margin: 0;"></ol>
        </div>
    </div>

    <div class="word-box" id="statusBox"></div>

    <script>
        let availableWords = [
            { word: "overhead", posType: "adverb", breakdown: "o - ver - head", ipa: "/ˌoʊvərˈhɛd/", phonicsSounds: ["oh", "ver", "hed"], pos: "adv. 副詞", translation: "在頭頂上；在空中", definition: "above the level of the head", sentence: "The birds flew overhead as we walked through the park on Sunday." },
            { word: "curious", posType: "adjective", breakdown: "cu - ri - ous", ipa: "/ˈkjʊriəs/", phonicsSounds: ["kyur", "ee", "us"], pos: "adj. 形容詞", translation: "好奇的", definition: "eager to know or learn something", sentence: "The curious child asked many questions during the school field trip." },
            { word: "secret", posType: "noun", breakdown: "se - cret", ipa: "/ˈsiːkrət/", phonicsSounds: ["see", "krit"], pos: "n. 名詞", translation: "秘密", definition: "something that is kept hidden or not told to others", sentence: "She shared her secret with her closest friend only, trusting her completely." },
            { word: "experiment", posType: "noun", breakdown: "ex - per - i - ment", ipa: "/ɪkˈspɛrəmənt/", phonicsSounds: ["ek", "sper", "uh", "munt"], pos: "n. 名詞", translation: "實驗", definition: "a test that scientists do to learn new things", sentence: "The science class conducted an experiment using some pretty dangerous chemicals." },
            { word: "chemistry", posType: "noun", breakdown: "chem - is - try", ipa: "/ˈkɛmɪstri/", phonicsSounds: ["kem", "ih", "stree"], pos: "n. 名詞", translation: "化學", definition: "the study of what things are made of and how they change", sentence: "My neighbor has always been interested in studying chemistry since she was young." },
            { word: "potion", posType: "noun", breakdown: "po - tion", ipa: "/ˈpoʊʃən/", phonicsSounds: ["poh", "shun"], pos: "n. 名詞", translation: "藥水；魔藥", definition: "a healing, magical, or poisonous liquid", sentence: "The white witch brewed a potion in her cauldron to heal the wounded knight." },
            { word: "explosion", posType: "noun", breakdown: "ex - plo - sion", ipa: "/ɪkˈsploʊʒən/", phonicsSounds: ["ek", "sploh", "zhun"], pos: "n. 名詞", translation: "爆炸；爆發", definition: "a violent, destructive blowing apart", sentence: "The loud explosion startled everyone in the vicinity, causing panic and fear." },
            { word: "electricity", posType: "noun", breakdown: "e - lec - tric - i - ty", ipa: "/ɪˌlɛkˈtrɪsəti/", phonicsSounds: ["ih", "lek", "tris", "ih", "tee"], pos: "n. 名詞", translation: "電力；電", definition: "a form of energy resulting from charged particles", sentence: "The power outage left the entire neighborhood without electricity for hours." },
            { word: "invisible", posType: "adjective", breakdown: "in - vis - i - ble", ipa: "/ɪnˈvɪzəbəl/", phonicsSounds: ["in", "viz", "ih", "bul"], pos: "adj. 形容詞", translation: "隱形的；看不見的", definition: "unable to be seen", sentence: "The young wizard student found a cloak that could make him invisible." },
            { word: "spark", posType: "noun", breakdown: "spark", ipa: "/spɑːrk/", phonicsSounds: ["spark"], pos: "n. 名詞", translation: "火花；火星", definition: "a small fiery particle from a fire or friction", sentence: "The workers in the factory need to wear helmets in case sparks fly into their eyes." },
            { word: "bulb", posType: "noun", breakdown: "bulb", ipa: "/bʌlb/", phonicsSounds: ["bulb"], pos: "n. 名詞", translation: "電燈泡", definition: "a glass object that gives light", sentence: "The old light bulb in the lamp flickered and then went out." },
            { word: "stencil", posType: "noun", breakdown: "sten - cil", ipa: "/ˈstɛnsəl/", phonicsSounds: ["sten", "sul"], pos: "n. 名詞", translation: "型版；模板", definition: "a thin sheet of material with a design cut out of it", sentence: "He used a stencil to learn how to draw patterns and to write letters." },
            { word: "dream", posType: "verb", breakdown: "dream", ipa: "/driːm/", phonicsSounds: ["dream"], pos: "v. 動詞", translation: "做夢；夢想", definition: "to experience thoughts, images, or emotions during sleep", sentence: "He dreamed of flying over mountains and rivers on a magical journey." },
            { word: "buggy", posType: "noun", breakdown: "bug - gy", ipa: "/ˈbʌɡi/", phonicsSounds: ["bug", "ee"], pos: "n. 名詞", translation: "輕型敞篷車；沙灘車", definition: "a small motor vehicle, typically with an open top", sentence: "They rode a dune buggy over the sandy terrain across the desert on an epic adventure." },
            { word: "engine", posType: "noun", breakdown: "en - gine", ipa: "/ˈɛndʒɪn/", phonicsSounds: ["en", "jin"], pos: "n. 名詞", translation: "引擎；發動機", definition: "a machine that converts power into motion", sentence: "The racecar's engine roared to life with a turn of the key and the driver got excited." }
        ];

        let testedWords = [];
        let selectedWords = [];

        let currentWordObj = null;
        let usVoice = null;

        function loadVoices() {
            const voices = speechSynthesis.getVoices();
            const enUSVoices = voices.filter(v => v.lang === "en-US");

            const selector = document.getElementById("voiceSelector");
            selector.innerHTML = "";

            enUSVoices.forEach((voice, index) => {
                const option = document.createElement("option");
                option.value = index;
                option.textContent = voice.name + (voice.lang !== "en-US" ? " (" + voice.lang + ")" : "");
                selector.appendChild(option);
            });

            // 優先選擇 Google US English 發音
            let defaultVoice = enUSVoices.find(v => v.name === "Google US English");
            if (!defaultVoice) defaultVoice = enUSVoices.find(v => v.name.includes("Google") && (v.lang === "en-US" || v.name.includes("US")));
            if (!defaultVoice) defaultVoice = enUSVoices.find(v => v.name.includes("Google"));
            if (!defaultVoice) defaultVoice = enUSVoices.find(v => v.name === "Samantha");
            if (!defaultVoice) defaultVoice = enUSVoices.find(v => v.name === "Aaron");
            if (!defaultVoice) defaultVoice = enUSVoices.find(v => v.name === "Alex");
            if (!defaultVoice) defaultVoice = enUSVoices.find(v => v.name === "Flo");
            if (!defaultVoice) defaultVoice = enUSVoices[0];

            usVoice = defaultVoice;

            const defaultIndex = enUSVoices.indexOf(defaultVoice);
            if (defaultIndex !== -1) {
                selector.selectedIndex = defaultIndex;
            }

            window.availableVoices = enUSVoices;
        }

        function changeVoice() {
            const selector = document.getElementById("voiceSelector");
            const selectedIndex = selector.value;
            usVoice = window.availableVoices[selectedIndex];
        }

        speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();

        function toggleWordSelection(word) {
            const wordObj = availableWords.find(w => w.word === word);
            if (!wordObj) return;

            selectedWords.push(wordObj);

            const index = availableWords.findIndex(w => w.word === word);
            if (index !== -1) {
                availableWords.splice(index, 1);
            }

            refreshLists();
        }

        function removeFromSelected(word) {
            const index = selectedWords.findIndex(w => w.word === word);
            if (index !== -1) {
                const wordObj = selectedWords[index];
                selectedWords.splice(index, 1);
                availableWords.push(wordObj);
                refreshLists();
            }
        }

        function refreshLists() {
            document.getElementById("leftList").innerHTML = availableWords
                .map(w => `<li onclick="toggleWordSelection('${w.word}')"><span>${w.word}</span><span class="pos-badge">(${w.posType})</span></li>`)
                .join("");

            document.getElementById("rightList").innerHTML = testedWords
                .map(w => `<li class='tested' onclick="speakOnce('${w.word}')"><span>${w.word}</span><span class="pos-badge">(${w.posType})</span></li>`)
                .join("");

            document.getElementById("selectedWordsList").innerHTML = selectedWords
                .map(w => `<span class="selected-word-tag" onclick="removeFromSelected('${w.word}')">${w.word} (${w.posType}) ×</span>`)
                .join("");
        }

        // 只唸單字本身，不唸詞性
        function speakOnce(word) {
            speechSynthesis.cancel();
            speechSynthesis.resume();
            const utter = new SpeechSynthesisUtterance(word);
            utter.lang = "en-US";
            utter.rate = 0.75;
            utter.pitch = 1.0;
            if (usVoice) {
                utter.voice = usVoice;
            }
            utter.onerror = (e) => {
                console.warn("Speech synthesis error, falling back:", e);
                if (utter.voice) {
                    const fallback = new SpeechSynthesisUtterance(word);
                    fallback.lang = "en-US";
                    fallback.rate = 0.75;
                    const gVoice = window.availableVoices ? window.availableVoices.find(v => v.name.includes("Google")) : null;
                    if (gVoice && gVoice !== utter.voice) fallback.voice = gVoice;
                    speechSynthesis.speak(fallback);
                }
            };
            speechSynthesis.speak(utter);
        }

        function nextWord() {
            const wordsToTest = selectedWords.length > 0 ? selectedWords : availableWords;

            if (wordsToTest.length === 0) {
                document.getElementById("statusBox").innerText = "All words tested! Great job! 🎉";
                document.body.style.background = "#d6ffd6";
                return;
            }

            const index = Math.floor(Math.random() * wordsToTest.length);
            currentWordObj = wordsToTest[index];

            const availableIndex = availableWords.findIndex(w => w.word === currentWordObj.word);
            if (availableIndex !== -1) {
                availableWords.splice(availableIndex, 1);
            }
            const selectedIndex = selectedWords.findIndex(w => w.word === currentWordObj.word);
            if (selectedIndex !== -1) {
                selectedWords.splice(selectedIndex, 1);
            }

            testedWords.push(currentWordObj);
            refreshLists();

            document.getElementById("currentWordDisplay").innerHTML =
                `${currentWordObj.word} <span style="font-size:26px; color:#666; font-weight:normal;">(${currentWordObj.posType})</span><br>` +
                `<span style="font-size:24px; color:#555;">${currentWordObj.breakdown} &nbsp; ${currentWordObj.ipa}</span><br>` +
                `<span style="font-size:20px; color:#2c3e50; font-weight:normal;">[${currentWordObj.pos}] ${currentWordObj.translation}</span><br>` +
                `<span style="font-size:16px; color:#666; font-style:italic; font-weight:normal; display:inline-block; margin-top:6px; max-width:680px;">💡 ${currentWordObj.definition}</span><br>` +
                `<span style="font-size:16px; color:#2980b9; font-weight:normal; display:inline-block; margin-top:4px; max-width:680px;">📝 ${currentWordObj.sentence}</span>`;
            document.getElementById("statusBox").innerText = "Playing word...";

            // 考試發音只唸單字
            speakOnce(currentWordObj.word);
        }

        function showPhonics() {
            if (!currentWordObj) {
                document.getElementById("statusBox").innerText = "No word selected yet!";
                return;
            }

            document.getElementById("statusBox").innerText = "Playing phonics breakdown...";

            const parts = currentWordObj.phonicsSounds || currentWordObj.breakdown.split(" - ");

            let delay = 0;

            parts.forEach(part => {
                setTimeout(() => speakOnce(part), delay);
                delay += 1000;
            });

            setTimeout(() => speakOnce(currentWordObj.word), delay);
        }

        function replayWord() {
            if (!currentWordObj) {
                document.getElementById("statusBox").innerText = "No word selected yet!";
                return;
            }
            document.getElementById("statusBox").innerText = "Replaying word...";
            speakOnce(currentWordObj.word);
        }

        // ============= 共用語音引擎 =============
        let activeMode = null;
        let modeTimeouts = [];

        function isModeRunning() {
            return activeMode !== null;
        }

        function speakWithPromise(word, rate = 0.75) {
            return new Promise(resolve => {
                if (!isModeRunning()) { resolve(); return; }

                const utter = new SpeechSynthesisUtterance(word);
                utter.lang = "en-US";
                utter.rate = rate;
                utter.pitch = 1.0;
                if (usVoice) utter.voice = usVoice;

                let resolved = false;
                const safeResolve = () => {
                    if (!resolved) {
                        resolved = true;
                        resolve();
                    }
                };

                utter.onend = safeResolve;
                utter.onerror = safeResolve;

                const wordsCount = word.split(/\s+/).length;
                const baseMs = Math.max(800, wordsCount * 600);
                const fallbackMs = Math.ceil(baseMs / rate) + 500;
                const fallbackId = setTimeout(safeResolve, fallbackMs);
                modeTimeouts.push(fallbackId);

                speechSynthesis.speak(utter);

                const keepAliveId = setInterval(() => {
                    if (resolved || !isModeRunning()) {
                        clearInterval(keepAliveId);
                        return;
                    }
                    if (speechSynthesis.paused) {
                        speechSynthesis.resume();
                    }
                }, 3000);
                modeTimeouts.push(keepAliveId);
            });
        }

        function waitMs(ms) {
            return new Promise(resolve => {
                const timeoutId = setTimeout(resolve, ms);
                modeTimeouts.push(timeoutId);
            });
        }

        // ============= 自動測驗模式 =============
        let isAutoQuizRunning = false;
        let autoQuizWordsQueue = [];

        function speakEnglish(word, rate = 0.75) {
            return speakWithPromise(word, rate);
        }

        function wait(ms) {
            return waitMs(ms);
        }

        async function autoQuizWord(wordObj, index) {
            if (!isAutoQuizRunning) return;

            document.getElementById("autoQuizStatus").innerText =
                `第 ${index + 1} 個，共 ${autoQuizWordsQueue.length} 個`;
            document.getElementById("currentWordDisplay").innerHTML =
                `Word number ${index + 1}`;

            await speakEnglish(`Word number ${index + 1}`, 0.9);
            if (!isAutoQuizRunning) return;
            await wait(300);

            for (let cycle = 0; cycle < 2; cycle++) {
                if (!isAutoQuizRunning) return;
                const rate = cycle === 0 ? 0.3 : 1.0;

                // 只唸單字
                await speakEnglish(wordObj.word, rate);
                if (!isAutoQuizRunning) return;
                await wait(400);

                const parts = wordObj.phonicsSounds || wordObj.breakdown.split(" - ");
                for (const part of parts) {
                    if (!isAutoQuizRunning) return;
                    await speakEnglish(part, rate);
                    await wait(300);
                }
                if (!isAutoQuizRunning) return;
                await wait(300);

                // 只唸單字
                await speakEnglish(wordObj.word, rate);
                if (!isAutoQuizRunning) return;
                await wait(500);
            }

            const availableIndex = availableWords.findIndex(w => w.word === wordObj.word);
            if (availableIndex !== -1) availableWords.splice(availableIndex, 1);
            const selectedIndex = selectedWords.findIndex(w => w.word === wordObj.word);
            if (selectedIndex !== -1) selectedWords.splice(selectedIndex, 1);
            testedWords.push(wordObj);
            refreshLists();
            currentWordObj = wordObj;
            document.getElementById("currentWordDisplay").innerHTML =
                `${wordObj.word} <span style="font-size:26px; color:#666; font-weight:normal;">(${wordObj.posType})</span><br>` +
                `<span style="font-size:24px; color:#555;">${wordObj.breakdown} &nbsp; ${wordObj.ipa}</span><br>` +
                `<span style="font-size:20px; color:#2c3e50; font-weight:normal;">[${wordObj.pos}] ${wordObj.translation}</span><br>` +
                `<span style="font-size:16px; color:#666; font-style:italic; font-weight:normal; display:inline-block; margin-top:6px; max-width:680px;">💡 ${wordObj.definition}</span><br>` +
                `<span style="font-size:16px; color:#2980b9; font-weight:normal; display:inline-block; margin-top:4px; max-width:680px;">📝 ${wordObj.sentence}</span>`;
        }

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        async function runAutoQuiz() {
            const wordsToQuiz = selectedWords.length > 0 ? [...selectedWords] : [...availableWords];
            autoQuizWordsQueue = shuffleArray(wordsToQuiz);

            if (autoQuizWordsQueue.length === 0) {
                document.getElementById("autoQuizStatus").innerText = "沒有單字可以考試！";
                stopAutoQuiz();
                return;
            }

            document.getElementById("autoQuizStatus").innerText =
                `開始自動測驗，共 ${autoQuizWordsQueue.length} 個單字`;
            await wait(1000);

            for (let i = 0; i < autoQuizWordsQueue.length; i++) {
                if (!isAutoQuizRunning) break;
                await autoQuizWord(autoQuizWordsQueue[i], i);
                if (!isAutoQuizRunning) break;
                if (i < autoQuizWordsQueue.length - 1) await wait(1000);
            }

            if (isAutoQuizRunning) {
                document.getElementById("autoQuizStatus").innerText = "🎉 所有單字都考完了！太棒了！";
                document.getElementById("statusBox").innerText = "All words tested! Great job! 🎉";
                document.body.style.background = "#d6ffd6";
                stopAutoQuiz();
            }
        }

        function startAutoQuiz() {
            if (isModeRunning()) stopCurrentMode();
            isAutoQuizRunning = true;
            activeMode = 'quiz';
            document.getElementById("autoQuizBtn").style.display = "none";
            document.getElementById("stopQuizBtn").style.display = "inline-block";

            primeSpeech();

            setTimeout(() => {
                if (isAutoQuizRunning) runAutoQuiz();
            }, 300);
        }

        function stopAutoQuiz() {
            isAutoQuizRunning = false;
            stopCurrentMode();
            document.getElementById("autoQuizBtn").style.display = "inline-block";
            document.getElementById("stopQuizBtn").style.display = "none";
            if (document.getElementById("autoQuizStatus").innerText.indexOf("🎉") === -1) {
                document.getElementById("autoQuizStatus").innerText = "測驗已停止";
            }
        }

        // ============= 共用工具 =============
        function primeSpeech() {
            speechSynthesis.resume();
            const primer = new SpeechSynthesisUtterance(" ");
            primer.lang = "en-US";
            primer.volume = 0.01;
            primer.rate = 2;
            if (usVoice) primer.voice = usVoice;
            speechSynthesis.speak(primer);
        }

        function stopCurrentMode() {
            activeMode = null;
            speechSynthesis.cancel();
            modeTimeouts.forEach(id => {
                clearTimeout(id);
                clearInterval(id);
            });
            modeTimeouts = [];
        }

        // ============= 自動學習模式 =============
        let isAutoLearnRunning = false;

        async function learnWord(wordObj, wordIndex, totalWords, round, totalRounds) {
            if (!isAutoLearnRunning) return;

            const progress = document.getElementById("learnProgress");
            const wordDisplay = document.getElementById("learnWordDisplay");
            const stepDisplay = document.getElementById("learnStepDisplay");

            progress.innerText = `第 ${round} / ${totalRounds} 輪 — 第 ${wordIndex + 1} / ${totalWords} 個單字`;
            wordDisplay.innerHTML = `${wordObj.word} <span style="font-size:24px; color:#2e7d32; font-weight:normal;">(${wordObj.posType})</span>`;

            // Step 1: 唸單字（慢速）— 只唸單字
            stepDisplay.innerText = "🔊 唸單字（慢速）";
            await speakWithPromise(wordObj.word, 0.4);
            if (!isAutoLearnRunning) return;
            await waitMs(500);

            // Step 2: 逐字母拼讀（只拼單字字母）
            const letters = wordObj.word.toUpperCase().split("");
            stepDisplay.innerText = "🔤 拼讀字母：" + letters.join(" - ");
            const spellingText = letters.join(", ");
            await speakWithPromise(spellingText, 1.0);
            if (!isAutoLearnRunning) return;
            await waitMs(300);

            // Step 3: 音節拆解
            const parts = wordObj.phonicsSounds || wordObj.breakdown.split(" - ");
            stepDisplay.innerText = "📝 音節拆解：" + wordObj.breakdown;
            for (const part of parts) {
                if (!isAutoLearnRunning) return;
                await speakWithPromise(part, 0.6);
                await waitMs(400);
            }
            if (!isAutoLearnRunning) return;
            await waitMs(300);

            // Step 4: 再唸一次（正常速度）— 只唸單字
            stepDisplay.innerText = "🔊 完整唸一次";
            await speakWithPromise(wordObj.word, 0.85);
            if (!isAutoLearnRunning) return;

            // Step 5: 停頓讓孩子跟讀
            stepDisplay.innerText = "⏸️ 跟讀時間...";
            wordDisplay.innerHTML =
                `${wordObj.word} <span style="font-size:24px; color:#2e7d32; font-weight:normal;">(${wordObj.posType})</span><br>` +
                `<span style="font-size:20px; color:#666;">${wordObj.breakdown} &nbsp; ${wordObj.ipa}</span><br>` +
                `<span style="font-size:18px; color:#2e7d32; font-weight:normal;">[${wordObj.pos}] ${wordObj.translation}</span><br>` +
                `<span style="font-size:15px; color:#555; font-style:italic; font-weight:normal; display:inline-block; margin-top:4px;">💡 ${wordObj.definition}</span><br>` +
                `<span style="font-size:15px; color:#1b5e20; font-weight:normal; display:inline-block; margin-top:2px;">📝 ${wordObj.sentence}</span>`;
            await waitMs(3000);
        }

        async function runAutoLearn() {
            const wordsToLearn = selectedWords.length > 0 ? [...selectedWords] : [...availableWords];
            const totalRounds = parseInt(document.getElementById("loopCount").value) || 2;

            if (wordsToLearn.length === 0) {
                document.getElementById("learnProgress").innerText = "沒有單字可以學習！";
                stopAutoLearn();
                return;
            }

            const totalWords = wordsToLearn.length;

            for (let round = 1; round <= totalRounds; round++) {
                if (!isAutoLearnRunning) break;

                document.getElementById("learnProgress").innerText =
                    `🔄 第 ${round} / ${totalRounds} 輪開始！`;
                await waitMs(1000);

                for (let i = 0; i < wordsToLearn.length; i++) {
                    if (!isAutoLearnRunning) break;
                    await learnWord(wordsToLearn[i], i, totalWords, round, totalRounds);
                    if (!isAutoLearnRunning) break;
                    if (i < wordsToLearn.length - 1) await waitMs(800);
                }

                if (isAutoLearnRunning && round < totalRounds) {
                    document.getElementById("learnProgress").innerText =
                        `✅ 第 ${round} 輪完成！準備下一輪...`;
                    document.getElementById("learnStepDisplay").innerText = "";
                    await waitMs(2000);
                }
            }

            if (isAutoLearnRunning) {
                document.getElementById("learnProgress").innerText =
                    `🎉 全部 ${totalRounds} 輪學習完成！太棒了！`;
                document.getElementById("learnWordDisplay").innerText = "";
                document.getElementById("learnStepDisplay").innerText = "";
                stopAutoLearn();
            }
        }

        function startAutoLearn() {
            if (isModeRunning()) stopCurrentMode();
            isAutoLearnRunning = true;
            activeMode = 'learn';
            document.getElementById("autoLearnBtn").style.display = "none";
            document.getElementById("stopLearnBtn").style.display = "inline-block";

            primeSpeech();

            setTimeout(() => {
                if (isAutoLearnRunning) runAutoLearn();
            }, 300);
        }

        function stopAutoLearn() {
            isAutoLearnRunning = false;
            stopCurrentMode();
            document.getElementById("autoLearnBtn").style.display = "inline-block";
            document.getElementById("stopLearnBtn").style.display = "none";
            if (document.getElementById("learnProgress").innerText.indexOf("🎉") === -1) {
                document.getElementById("learnProgress").innerText = "學習已停止";
            }
        }

        refreshLists();
    </script>
</body>

</html>
