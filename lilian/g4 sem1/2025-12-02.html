<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vocabulary Spelling Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f8ff;
            padding: 20px;
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
        }

        .list-box {
            width: 200px;
            background: white;
            border: 2px solid #4a90e2;
            border-radius: 10px;
            padding: 10px;
            text-align: left;
            min-height: 250px;
        }

        .list-box h2 {
            text-align: center;
        }

        li {
            font-size: 18px;
            margin: 6px 0;
            cursor: pointer;
            transition: 0.2s;
            padding: 4px 8px;
        }

        li:hover {
            background: #e0f0ff;
            border-radius: 6px;
        }

        .selected-word-tag {
            background: #4a90e2;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .selected-word-tag:hover {
            background: #357abd;
        }

        .tested {
            color: gray;
            text-decoration: line-through;
        }

        button {
            padding: 16px 28px;
            font-size: 22px;
            margin: 12px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            background: #ff9f43;
            color: white;
            font-weight: bold;
        }

        button:hover {
            background: #ff7f00;
        }

        #currentWordDisplay {
            font-size: 40px;
            font-weight: bold;
            margin-top: 10px;
            min-height: 50px;
        }

        .word-box {
            margin-top: 30px;
            font-size: 28px;
            font-weight: bold;
            min-height: 40px;
        }
    </style>
</head>

<body>
    <h1>Vocabulary Spelling Test</h1>
    <p>Press the button to hear a word. It will be spoken once.</p>
    <div id="currentWordDisplay"></div>

    <div id="selectedWordsDisplay" style="margin: 20px 0; min-height: 30px;">
        <div style="font-size: 18px; color: #555; margin-bottom: 10px;">Selected Words:</div>
        <div id="selectedWordsList" style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;"></div>
    </div>

    <button onclick="nextWord()">Next Word</button>
    <button onclick="replayWord()">Replay Current Word</button>
    <button onclick="showPhonics()" style="background: #2ecc71;">Show Phonics</button>
    <button onclick="startHandwritingExam()" class="btn-handwriting-exam" style="background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: white; box-shadow: 0 4px 10px rgba(2, 132, 199, 0.35); font-weight: bold; border-radius: 8px; padding: 10px 18px; border: none; cursor: pointer; font-size: 16px; margin: 4px;">✍️ 手寫測驗 (AI 評判)</button>


    <div style="margin-top: 20px;">
        <label for="voiceSelector" style="font-size: 18px; margin-right: 10px;">選擇發音：</label>
        <select id="voiceSelector" onchange="changeVoice()" style="padding: 8px; font-size: 16px; border-radius: 8px;">
        </select>
    </div>

    <div class="container">
        <div class="list-box">
            <h2>Words To Study</h2>
            <ul id="leftList"></ul>
        </div>

        <div class="list-box">
            <h2>Words Tested</h2>
            <ol id="rightList"></ol>
        </div>
    </div>

    <div class="word-box" id="statusBox"></div>

    <script>
        let availableWords = [
            { word: "raggedy", breakdown: "rag - ge - dy", ipa: "/ˈræɡɪdi/", phonicsSounds: ["rag", "guh", "dee"] },
            { word: "harsh", breakdown: "h - ar - sh", ipa: "/hɑrʃ/", phonicsSounds: ["huh", "ar", "sh"] },
            { word: "blurt", breakdown: "bl - ur - t", ipa: "/blɜrt/", phonicsSounds: ["bluh", "er", "t"] },
            { word: "seal", breakdown: "s - ea - l", ipa: "/sil/", phonicsSounds: ["suh", "eel", "l"] },
            { word: "unaware", breakdown: "un - a - ware", ipa: "/ˌʌnəˈwɛr/", phonicsSounds: ["un", "uh", "ware"] },
            { word: "vent", breakdown: "v - en - t", ipa: "/vɛnt/", phonicsSounds: ["vuh", "en", "t"] },
            { word: "ache", breakdown: "a - che", ipa: "/eɪk/", phonicsSounds: ["ay", "k"] },
            { word: "snatch", breakdown: "sn - a - tch", ipa: "/snætʃ/", phonicsSounds: ["snuh", "a", "ch"] },
            { word: "surely", breakdown: "sure - ly", ipa: "/ˈʃʊrli/", phonicsSounds: ["sure", "lee"] },
            { word: "irritating", breakdown: "ir - ri - ta - ting", ipa: "/ˈɪrɪteɪtɪŋ/", phonicsSounds: ["ir", "ri", "tay", "ting"] },
            { word: "tame", breakdown: "t - a - me", ipa: "/teɪm/", phonicsSounds: ["tuh", "ay", "m"] },
            { word: "outnumber", breakdown: "out - num - ber", ipa: "/ˌaʊtˈnʌmbər/", phonicsSounds: ["out", "num", "ber"] },
            { word: "pout", breakdown: "p - ou - t", ipa: "/paʊt/", phonicsSounds: ["puh", "ow", "t"] },
            { word: "leather", breakdown: "lea - ther", ipa: "/ˈlɛðər/", phonicsSounds: ["leh", "ther"] },
            { word: "serene", breakdown: "se - rene", ipa: "/səˈrin/", phonicsSounds: ["suh", "reen"] },
            { word: "opinion", breakdown: "o - pin - ion", ipa: "/əˈpɪnjən/", phonicsSounds: ["oh", "pin", "yun"] },
            { word: "suggest", breakdown: "sug - gest", ipa: "/səɡˈdʒɛst/", phonicsSounds: ["sug", "jest"] },
            { word: "safety", breakdown: "safe - ty", ipa: "/ˈseɪfti/", phonicsSounds: ["sayf", "tee"] }
        ];

        let testedWords = [];
        let selectedWords = []; // 用戶選擇要考的單字

        let currentWordObj = null;
        let usVoice = null;

        function loadVoices() {
            const voices = speechSynthesis.getVoices();
            const enUSVoices = voices.filter(v => v.lang === "en-US");

            // 填充下拉選單
            const selector = document.getElementById("voiceSelector");
            selector.innerHTML = "";

            enUSVoices.forEach((voice, index) => {
                const option = document.createElement("option");
                option.value = index;
                option.textContent = voice.name + (voice.lang !== "en-US" ? " (" + voice.lang + ")" : "");
                selector.appendChild(option);
            });

            // 優先選擇 Flo
            let defaultVoice = enUSVoices.find(v => v.name === "Flo");
            if (!defaultVoice) defaultVoice = enUSVoices.find(v => v.lang === "en-US" && v.name.includes("Male"));
            if (!defaultVoice) defaultVoice = enUSVoices.find(v => v.name === "Aaron"); // Mac 常見男聲
            if (!defaultVoice) defaultVoice = enUSVoices.find(v => v.name === "Google US English"); // Chrome 常見
            if (!defaultVoice) defaultVoice = enUSVoices.find(v => v.name === "Samantha"); // Mac 備案
            if (!defaultVoice) defaultVoice = enUSVoices[0];

            usVoice = defaultVoice;

            // 設定下拉選單的預設值
            const defaultIndex = enUSVoices.indexOf(defaultVoice);
            if (defaultIndex !== -1) {
                selector.selectedIndex = defaultIndex;
            }

            // 儲存所有可用的聲音供切換使用
            window.availableVoices = enUSVoices;
        }

        function changeVoice() {
            const selector = document.getElementById("voiceSelector");
            const selectedIndex = selector.value;
            usVoice = window.availableVoices[selectedIndex];
        }

        speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();

        function toggleWordSelection(word) {
            const wordObj = availableWords.find(w => w.word === word);
            if (!wordObj) return;

            // 將單字加入選擇列表
            selectedWords.push(wordObj);

            // 從可用列表中移除
            const index = availableWords.findIndex(w => w.word === word);
            if (index !== -1) {
                availableWords.splice(index, 1);
            }

            refreshLists();
        }

        function removeFromSelected(word) {
            const index = selectedWords.findIndex(w => w.word === word);
            if (index !== -1) {
                const wordObj = selectedWords[index];
                selectedWords.splice(index, 1);
                availableWords.push(wordObj);
                refreshLists();
            }
        }

        function refreshLists() {
            // 更新可用單字列表
            document.getElementById("leftList").innerHTML = availableWords
                .map(w => `<li onclick="toggleWordSelection('${w.word}')">${w.word}</li>`)
                .join("");

            // 更新已測試單字列表
            document.getElementById("rightList").innerHTML = testedWords
                .map(w => `<li class='tested' onclick="speakOnce('${w.word}')">${w.word}</li>`)
                .join("");

            // 更新選擇的單字顯示
            document.getElementById("selectedWordsList").innerHTML = selectedWords
                .map(w => `<span class="selected-word-tag" onclick="removeFromSelected('${w.word}')">${w.word} ×</span>`)
                .join("");
        }

        function speakOnce(word) {
            const utter = new SpeechSynthesisUtterance(word);
            utter.lang = "en-US"; // 強制設定語言
            utter.rate = 0.75;
            utter.pitch = 1.0; // 調整為正常音調
            if (usVoice) {
                utter.voice = usVoice;
            }
            speechSynthesis.speak(utter);
        }

        function nextWord() {
            // 如果有選擇的單字，從選擇的單字中抽取
            const wordsToTest = selectedWords.length > 0 ? selectedWords : availableWords;

            if (wordsToTest.length === 0) {
                document.getElementById("statusBox").innerText = "All words tested! Great job! 🎉";
                document.body.style.background = "#d6ffd6";
                return;
            }

            const index = Math.floor(Math.random() * wordsToTest.length);
            currentWordObj = wordsToTest[index];

            // 從兩個列表中移除
            const availableIndex = availableWords.findIndex(w => w.word === currentWordObj.word);
            if (availableIndex !== -1) {
                availableWords.splice(availableIndex, 1);
            }
            const selectedIndex = selectedWords.findIndex(w => w.word === currentWordObj.word);
            if (selectedIndex !== -1) {
                selectedWords.splice(selectedIndex, 1);
            }

            testedWords.push(currentWordObj);
            refreshLists();

            document.getElementById("currentWordDisplay").innerHTML =
                `${currentWordObj.word}<br><span style="font-size:24px; color:#555;">${currentWordObj.breakdown} &nbsp; ${currentWordObj.ipa}</span>`;
            document.getElementById("statusBox").innerText = "Playing word...";

            speakOnce(currentWordObj.word);
        }

        function showPhonics() {
            if (!currentWordObj) {
                document.getElementById("statusBox").innerText = "No word selected yet!";
                return;
            }

            document.getElementById("statusBox").innerText = "Playing phonics breakdown...";

            // Use phonicsSounds if available, otherwise split breakdown
            const parts = currentWordObj.phonicsSounds || currentWordObj.breakdown.split(" - ");

            // Create a sequence of utterances
            let delay = 0;

            parts.forEach(part => {
                setTimeout(() => speakOnce(part), delay);
                delay += 1000; // 1 second gap between parts
            });

            // Play full word at the end
            setTimeout(() => speakOnce(currentWordObj.word), delay);
        }

        function replayWord() {
            if (!currentWordObj) {
                document.getElementById("statusBox").innerText = "No word selected yet!";
                return;
            }
            document.getElementById("statusBox").innerText = "Replaying word...";
            speakOnce(currentWordObj.word);
        }

        refreshLists();
    
        // ============= 手寫測驗 (連動 English/Handwriting_Practice.html) =============
        function startHandwritingExam() {
            let words = [];
            if (typeof selectedWords !== 'undefined' && selectedWords && selectedWords.length > 0) {
                words = selectedWords;
            } else if (typeof availableWords !== 'undefined' && availableWords && availableWords.length > 0) {
                words = availableWords;
            } else if (typeof testedWords !== 'undefined' && testedWords && testedWords.length > 0) {
                words = testedWords;
            } else if (typeof wordsToStudy !== 'undefined' && wordsToStudy && wordsToStudy.length > 0) {
                words = wordsToStudy;
            }
            
            if (!words || words.length === 0) {
                if (typeof dragonWords !== 'undefined') words = dragonWords;
                else if (typeof primoWords !== 'undefined') words = primoWords;
                else if (typeof eruptionWords !== 'undefined') words = eruptionWords;
                else if (typeof miracleWords !== 'undefined') words = miracleWords;
                else if (typeof arsenioWords !== 'undefined') words = arsenioWords;
                else if (typeof allWords !== 'undefined') words = allWords;
            }

            const h1El = document.querySelector('h1');
            const pageTitle = (h1El ? h1El.innerText : document.title)
                .replace('單字小考 - ', '').replace('Spelling Quiz - ', '').trim();

            let student = 'Barry';
            if (typeof currentStudent !== 'undefined' && currentStudent) {
                student = currentStudent;
            } else if (window.location.pathname.toLowerCase().includes('lilian')) {
                student = 'Lilian';
            }

            const payload = {
                title: pageTitle,
                words: words,
                student: student,
                returnUrl: window.location.href
            };

            sessionStorage.setItem('handwriting_active_exam', JSON.stringify(payload));

            const path = window.location.pathname;
            let target = '../English/Handwriting_Practice.html?from=exam';
            if (path.includes('/G3 sem1/') || path.includes('/G2_Spelling_Bee/') || path.includes('/g2 sem1/') ||
                path.includes('/G5期中/') || path.includes('/G4 sem2/') || path.includes('/G4_Spelling_Bee/') || 
                path.includes('/g4 sem1/') || path.includes('/G4_Spelling_Bee_for_word/')) {
                target = '../../English/Handwriting_Practice.html?from=exam';
            }
            window.location.href = target;
        }

    </script>
</body>

</html>
