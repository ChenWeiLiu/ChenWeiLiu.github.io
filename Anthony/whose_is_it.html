<!DOCTYPE html>
<html lang="en" style="color-scheme: light">
<head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Whose Is It?</title>
    <style>
        :root {
            --ink: #243047;
            --muted: #5c6b82;
            --card: #ffffff;
            --ok: #1b8a4a;
            --ok-bg: #e5f8ec;
            --no: #c2413a;
            --no-bg: #ffeceb;
            --line: #e7edf5;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Avenir Next", "Segoe UI", "Chalkboard SE", "Comic Sans MS", sans-serif;
            color: var(--ink);
            background: linear-gradient(160deg, #fff4d8 0%, #d9f4ff 55%, #ffe3f2 100%);
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        header {
            max-width: 760px;
            margin: 0 auto;
            padding: 16px 16px 0;
            display: grid;
            grid-template-columns: 88px 1fr 88px;
            align-items: center;
            gap: 8px;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: clamp(1.45rem, 4.5vw, 2.15rem);
            line-height: 1.15;
        }

        header button,
        .ghost {
            border: 0;
            background: rgba(255, 255, 255, 0.8);
            color: var(--ink);
            border-radius: 999px;
            min-height: 48px;
            padding: 8px 14px;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
        }

        #stars {
            text-align: right;
            font-size: 1.35rem;
            letter-spacing: 1px;
            color: #e39b00;
        }

        main {
            max-width: 760px;
            margin: 0 auto;
            padding: 16px 16px 32px;
        }

        .lead, .zh {
            color: var(--muted);
            font-weight: 700;
        }

        .zh { font-size: 1.05rem; }

        .worlds, .choices, .stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .worlds { margin-top: 16px; }

        button { touch-action: manipulation; }

        button:focus-visible {
            outline: 4px solid #3a6ff0;
            outline-offset: 3px;
        }

        .world,
        .choice,
        .go {
            width: 100%;
            border: 0;
            border-radius: 24px;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
            text-align: left;
        }

        .world {
            display: flex;
            align-items: center;
            gap: 14px;
            min-height: 92px;
            padding: 14px 16px;
            color: var(--ink);
            box-shadow: 0 8px 0 rgba(36, 48, 71, 0.08);
        }

        .world:active, .choice:active, .go:active { transform: translateY(2px); }

        .world .emo { font-size: 2.6rem; line-height: 1; }
        .world b { display: block; font-size: 1.35rem; }
        .world span { display: block; color: var(--muted); font-size: 1rem; margin-top: 2px; }

        .playall {
            margin-top: 14px;
            width: 100%;
            min-height: 64px;
            border-radius: 22px;
            border: 4px solid var(--ink);
            background: #fff;
            color: var(--ink);
            font: inherit;
            font-weight: 800;
            font-size: 1.25rem;
            cursor: pointer;
        }

        .card {
            background: #ffffff;
            color: #172033;
            border-radius: 28px;
            padding: 18px;
            box-shadow: 0 12px 30px rgba(36, 48, 71, 0.08);
        }

        .pic {
            position: relative;
            min-height: 180px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
            padding: 18px 12px 28px;
        }

        .pic .big { line-height: 1; }
        .tag, .name {
            position: absolute;
            background: var(--ink);
            color: white;
            border-radius: 999px;
            padding: 4px 12px;
            font-weight: 800;
        }
        .tag { top: 10px; left: 10px; }
        .name { bottom: 10px; left: 10px; background: white; color: var(--ink); }

        .prompt {
            color: #172033;
            background: #fff8e8;
            border-radius: 20px;
            font-size: clamp(1.85rem, 5.4vw, 2.5rem);
            font-weight: 800;
            line-height: 1.45;
            margin: 14px 0 8px;
            padding: 14px 12px;
            text-align: center;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        .blank {
            display: inline-block;
            min-width: 7.5rem;
            height: 1.4em;
            margin: 0 6px;
            vertical-align: middle;
            background: #ffe08a;
            border: 3px dashed #e39b00;
            border-radius: 12px;
            color: transparent;
        }

        .blank.filled {
            height: auto;
            min-width: 0;
            padding: 0 10px;
            color: #146636;
            background: #e5f8ec;
            border-style: solid;
            border-color: #1b8a4a;
        }

        .slot {
            display: inline-block;
            white-space: nowrap;
            vertical-align: middle;
        }

        .after {
            color: #0f4c81;
            background: #e7f3ff;
            border-radius: 12px;
            padding: 0 8px;
        }

        .hint {
            display: block;
            width: fit-content;
            max-width: 100%;
            margin: 0 auto 14px;
            padding: 8px 14px;
            text-align: center;
            color: #0f4c81;
            background: #e7f3ff;
            border-radius: 999px;
            font-size: 1.2rem;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        .choice, .go {
            min-height: 76px;
            padding: 16px 18px;
            font-size: clamp(1.45rem, 4.5vw, 2rem);
            background: #fff;
            color: var(--ink);
            border: 4px solid #c9d6ea;
            box-shadow: 0 6px 0 #d5e0ef;
            text-align: center;
        }

        .choice.bad {
            background: var(--no-bg);
            border-color: #f0b4b0;
            color: var(--no);
            box-shadow: none;
        }

        .choice.good {
            background: var(--ok-bg);
            border-color: #8ed7aa;
            color: var(--ok);
            box-shadow: none;
        }

        .apo { color: #e23d3d; font-size: 1.2em; }

        .say {
            margin-top: 14px;
            border-radius: 20px;
            padding: 14px 16px;
        }

        .say.ok { background: var(--ok-bg); }
        .say.no { background: var(--no-bg); }
        .say .cheer { margin: 0 0 4px; font-size: 1.45rem; color: var(--ok); }
        .say .en { margin: 0; font-size: 1.28rem; font-weight: 800; line-height: 1.35; }
        .say .zh { margin: 6px 0 0; }

        .go {
            margin-top: 12px;
            background: #1f8a4d;
            color: white;
            border-color: #146636;
            box-shadow: 0 6px 0 #146636;
        }

        .hear {
            margin-top: 8px;
            background: #fff;
            color: var(--ink);
            border-color: #c9d6ea;
            box-shadow: 0 6px 0 #d5e0ef;
        }

        .chips, .nope { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
        .chip, .nope b {
            border-radius: 999px;
            padding: 8px 12px;
            font-size: 1.2rem;
        }
        .chip { background: #e8f7ee; }
        .nope b { background: #ffeceb; color: var(--no); text-decoration: line-through; font-weight: 800; }

        .rule-title { font-size: clamp(1.7rem, 5vw, 2.3rem); margin: 0 0 8px; }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>

    </script>
    <script>
        const DATA = JSON.parse(document.getElementById("game-data").textContent);
        const app = document.getElementById("app");
        const homeBtn = document.getElementById("homeBtn");
        const starsEl = document.getElementById("stars");
        const titleEl = document.getElementById("title");
        const cheers = ["Nice!", "You got it!", "Super!", "Great tap!", "Yes!"];
        let run = null;

        homeBtn.addEventListener("click", function () {
            window.clearTimeout(speakTimer);
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            showHome();
        });

        function esc(s) {
            return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function pretty(s) {
            return esc(s).split("'").join("<span class='apo'>'</span>");
        }

        function promptHTML(text, filled) {
            const parts = String(text).split("___");
            const before = pretty(parts[0] || "");
            const afterRaw = parts[1] || "";
            const afterWord = afterRaw.replace(/[?.!]/g, "").trim();
            const blank = filled
                ? "<span class='blank filled'>" + pretty(filled) + "</span>"
                : "<span class='blank'></span>";
            if (!afterWord) return before + blank + pretty(afterRaw);
            return before + "<span class='slot'>" + blank + "<span class='after'>" + pretty(afterRaw) + "</span></span>";
        }

        function emoSize(n) {
            if (n <= 2) return 96;
            if (n === 3) return 78;
            return 60;
        }

        function shuffle(list) {
            const a = list.map(function (item) { return item; });
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const swap = a[i];
                a[i] = a[j];
                a[j] = swap;
            }
            return a;
        }

        function worldById(id) {
            return DATA.worlds.find(function (world) { return world.id === id; });
        }

        function currentWorld() {
            return worldById(run.ids[run.wi]);
        }

        function itemTotal() {
            return run.ids.reduce(function (sum, id) {
                return sum + worldById(id).items.length;
            }, 0);
        }

        function starLabel(count) {
            if (!count) return "☆";
            return "★ " + count;
        }

        function paintChrome() {
            homeBtn.hidden = !run;
            titleEl.textContent = run ? currentWorld().title : "Whose Is It?";
            starsEl.textContent = starLabel(run && run.stars);
        }

        function showHome() {
            run = null;
            paintChrome();
            const buttons = DATA.worlds.map(function (world) {
                return "<button type='button' class='world' data-id='" + world.id + "' style='background:" + world.color + "'>" +
                    "<span class='emo'>" + world.emoji + "</span><span><b>" + esc(world.title) + "</b><span>" + esc(world.zh) + "</span></span></button>";
            }).join("");
            app.innerHTML =
                "<p class='lead'>Tap a big button.</p>" +
                "<p class='zh'>點一關。答錯會告訴你為什麼。</p>" +
                "<div class='worlds'>" + buttons + "</div>" +
                "<button type='button' class='playall' id='all'>Play them all<br><span class='zh'>五關都玩</span></button>";
            app.querySelectorAll(".world").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    sfx("tap");
                    start([btn.dataset.id]);
                });
            });
            document.getElementById("all").addEventListener("click", function () {
                sfx("tap");
                start(DATA.worlds.map(function (world) { return world.id; }));
            });
        }

        function start(ids) {
            run = { ids: ids, wi: 0, qi: 0, stars: 0, asked: 0, firstTry: true, locked: false, choices: [] };
            showRule();
        }

        function sceneHTML(item) {
            const pics = item.pics || [];
            const size = emoSize(pics.length);
            const emoji = pics.map(function (pic) {
                return "<span class='big' style='font-size:" + size + "px'>" + pic + "</span>";
            }).join("");
            const tag = item.tag ? "<span class='tag'>" + esc(item.tag) + "</span>" : "";
            const name = item.name ? "<span class='name'>" + esc(item.name) + "</span>" : "";
            return "<div class='pic' style='background:" + item.bg + "'>" + tag + emoji + name + "</div>";
        }

        function showRule() {
            const world = currentWorld();
            const rule = world.rule;
            paintChrome();
            app.innerHTML =
                "<section class='card'>" +
                "<p class='rule-title'>" + pretty(rule.title) + "</p>" +
                "<p class='zh'>" + esc(rule.zh) + "</p>" +
                "<div class='chips'>" + rule.chips.map(function (chip) { return "<span class='chip'>" + pretty(chip) + "</span>"; }).join("") + "</div>" +
                "<div class='nope'>" + rule.nope.map(function (word) { return "<b>" + pretty(word) + "</b>"; }).join("") + "</div>" +
                "<button type='button' class='go' id='go'>Play</button>" +
                "</section>";
            document.getElementById("go").addEventListener("click", function () {
                sfx("tap");
                showQuestion();
            });
        }

        function showQuestion() {
            const item = currentWorld().items[run.qi];
            run.firstTry = true;
            run.locked = false;
            run.choices = shuffle(item.choices);
            paintChrome();
            const buttons = run.choices.map(function (choice, index) {
                return "<button type='button' class='choice' data-i='" + index + "'>" + pretty(choice.t) + "</button>";
            }).join("");
            app.innerHTML =
                "<section class='card'>" +
                sceneHTML(item) +
                "<p class='prompt' id='prompt'>" + promptHTML(item.prompt) + "</p>" +
                "<p class='zh hint'>" + esc(item.hint) + "</p>" +
                "<div class='choices' id='choices'>" + buttons + "</div>" +
                "<div id='say' role='status'></div>" +
                "</section>";
            app.querySelectorAll(".choice").forEach(function (btn) {
                btn.addEventListener("click", function () { pick(Number(btn.dataset.i), btn); });
            });
        }

        function pick(index, btn) {
            if (!run || run.locked || btn.dataset.dead === "1") return;
            const item = currentWorld().items[run.qi];
            const choice = run.choices[index];
            const say = document.getElementById("say");
            if (choice.ok) {
                run.locked = true;
                btn.classList.add("good");
                app.querySelectorAll(".choice").forEach(function (other) {
                    if (other !== btn) other.disabled = true;
                });
                if (run.firstTry) run.stars += 1;
                run.asked += 1;
                paintChrome();
                document.getElementById("prompt").innerHTML = pretty(item.full);
                const cheer = cheers[Math.floor(Math.random() * cheers.length)];
                say.className = "say ok";
                say.innerHTML = "<p class='cheer'>" + cheer + "</p><p class='en'>" + pretty(item.whyEn) + "</p><p class='zh'>" + esc(item.whyZh) + "</p>";
                const next = document.createElement("button");
                next.type = "button";
                next.className = "go";
                next.id = "next";
                next.textContent = "Next";
                next.addEventListener("click", advance);
                say.after(next);
                const hear = document.createElement("button");
                hear.type = "button";
                hear.className = "go hear";
                hear.textContent = "Hear it";
                hear.addEventListener("click", function () { speak(item.full, 40); });
                next.after(hear);
                sfx("ok");
                speak(item.full, 420);
            } else {
                run.firstTry = false;
                btn.classList.add("bad");
                btn.dataset.dead = "1";
                sfx("no");
                say.className = "say no";
                say.innerHTML = "<p class='en'>" + pretty(choice.whyEn) + "</p><p class='zh'>" + esc(choice.whyZh) + "</p>";
            }
        }

        const NOVELTY = /^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Wobble|Fred|Good News|Jester|Junior|Organ|Superstar|Ralph|Trinoids|Whisper|Zarvox)$/i;
        let kidVoice = null;
        let speakTimer = 0;
        let audioCtx = null;

        function pickVoice() {
            if (!window.speechSynthesis) return null;
            const voices = window.speechSynthesis.getVoices().filter(function (voice) {
                return /^en(-|_)US/i.test(voice.lang || "") && !NOVELTY.test(voice.name);
            });
            const prefer = ["Samantha", "Flo", "Reed", "Sandy", "Shelley", "Kathy", "Google US English"];
            for (let i = 0; i < prefer.length; i++) {
                const exact = voices.find(function (voice) { return voice.name === prefer[i]; });
                if (exact) return exact;
                const close = voices.find(function (voice) { return voice.name.indexOf(prefer[i]) === 0; });
                if (close) return close;
            }
            return voices[0] || null;
        }

        function loadVoice() {
            kidVoice = pickVoice();
        }

        if (window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = loadVoice;
            loadVoice();
        }

        function forSpeech(text) {
            return String(text)
                .replace(/\bIt's\b/g, "It is")
                .replace(/\bit's\b/g, "it is")
                .replace(/(\w+)s'/g, "$1s")
                .replace(/(\w+)'s/g, "$1s");
        }

        function toneCtx() {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return null;
            if (!audioCtx) audioCtx = new Ctx();
            if (audioCtx.state === "suspended") audioCtx.resume();
            return audioCtx;
        }

        function blip(freq, start, dur, type, vol) {
            const ctx = toneCtx();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
            gain.gain.setValueAtTime(0.0001, ctx.currentTime + start);
            gain.gain.exponentialRampToValueAtTime(vol, ctx.currentTime + start + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + dur);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + start);
            osc.stop(ctx.currentTime + start + dur + 0.02);
        }

        function sfx(kind) {
            if (kind === "ok") {
                blip(523, 0, 0.12, "sine", 0.09);
                blip(659, 0.1, 0.12, "sine", 0.09);
                blip(784, 0.2, 0.2, "sine", 0.09);
            } else if (kind === "no") {
                blip(196, 0, 0.14, "triangle", 0.06);
                blip(146, 0.09, 0.16, "triangle", 0.05);
            } else if (kind === "tap") {
                blip(520, 0, 0.05, "sine", 0.04);
            } else if (kind === "win") {
                blip(523, 0, 0.1, "sine", 0.09);
                blip(659, 0.11, 0.1, "sine", 0.09);
                blip(784, 0.22, 0.1, "sine", 0.09);
                blip(1046, 0.33, 0.24, "sine", 0.09);
            }
        }

        function speak(text, delay) {
            try {
                if (!window.speechSynthesis) return;
                window.clearTimeout(speakTimer);
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(forSpeech(text));
                utter.lang = "en-US";
                utter.rate = 0.82;
                utter.pitch = 1;
                if (!kidVoice) kidVoice = pickVoice();
                if (kidVoice) utter.voice = kidVoice;
                speakTimer = window.setTimeout(function () {
                    if (!kidVoice) kidVoice = pickVoice();
                    if (kidVoice) utter.voice = kidVoice;
                    window.speechSynthesis.speak(utter);
                }, delay == null ? 80 : delay);
            } catch (err) {
                return;
            }
        }

        function advance() {
            const world = currentWorld();
            if (run.qi + 1 < world.items.length) {
                run.qi += 1;
                showQuestion();
                return;
            }
            if (run.wi + 1 < run.ids.length) {
                run.wi += 1;
                run.qi = 0;
                showBridge();
                return;
            }
            showEnd();
        }

        function showBridge() {
            const world = currentWorld();
            paintChrome();
            app.innerHTML =
                "<section class='card'>" +
                "<p class='rule-title'>" + world.emoji + " " + esc(world.title) + "</p>" +
                "<p class='zh'>" + esc(world.zh) + "</p>" +
                "<button type='button' class='go' id='go'>Go</button>" +
                "</section>";
            document.getElementById("go").addEventListener("click", showRule);
        }

        function showEnd() {
            sfx("win");
            const total = itemTotal();
            const played = run.ids.map(worldById);
            const line = run.stars === total
                ? "You got every star!"
                : (run.stars === 0 ? "You finished!" : ("You got " + run.stars + (run.stars === 1 ? " star!" : " stars!")));
            const recap = played.map(function (world) {
                return world.recap.map(function (text) { return "<p class='en'>" + pretty(text) + "</p>"; }).join("");
            }).join("");
            titleEl.textContent = "Whose Is It?";
            starsEl.textContent = starLabel(run.stars);
            app.innerHTML =
                "<section class='card'>" +
                "<p class='rule-title'>" + line + "</p>" +
                "<p class='zh'>可以再玩一次。</p>" +
                recap +
                "<button type='button' class='go' id='again'>Play again</button>" +
                "<button type='button' class='go hear' id='menu'>Home</button>" +
                "</section>";
            const ids = run.ids.slice();
            document.getElementById("again").addEventListener("click", function () { start(ids); });
            document.getElementById("menu").addEventListener("click", showHome);
        }

        showHome();
    </script>
